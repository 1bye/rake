[package]
name = "surface-spike-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
gpu = ["dep:anyhow", "dep:wgpu", "dep:web-time", "dep:metal", "dep:foreign-types"]

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = { version = "1", optional = true }
wgpu = { version = "=28.0.0", optional = true, default-features = false, features = ["std", "wgsl", "metal"] }
web-time = { workspace = true, optional = true }
metal = { version = "0.33", optional = true }
foreign-types = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
naga = { version = "28", features = ["wgsl-in"] }
