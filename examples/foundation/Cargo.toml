[package]
name = "rake-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rake-foundation"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rake = { workspace = true, features = ["experimental-view", "updates"] }

[package.metadata.rake.bundle]
name = "Rake Foundation"
identifier = "com.example.rake.foundation"

[package.metadata.rake.bundle.web]
offline = true

[build-dependencies]
rake-build = { path = "../../crates/rake-build" }

[package.metadata.rake.bundle.windows]
manifest = "windows.manifest.xml"
