[package]
name = "rake-notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rake-notes"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["rake/gpui", "dep:gpui-base"]
view-test-support = ["gui", "rake/view-test-support"]

[lints]
workspace = true

[dependencies]
rake = { package = "rake-app", path = "../../crates/rake", default-features = false }
gpui-base = { workspace = true, optional = true }
futures.workspace = true
thiserror.workspace = true
event-listener = "5.4"
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
blocking = "1.7"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[package.metadata.rake.bundle]
name = "Fieldnotes"
identifier = "dev.rake.fieldnotes"
minimum_system_version = "13.0"
