[package]
name = "rake-inspector"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rake-inspector"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["rake/gpui"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[dependencies]
rake = { package = "rake-app", path = "../../crates/rake", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
url = "2.5"

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "Storage"] }

[package.metadata.rake.bundle]
name = "Rake Inspector"
identifier = "dev.rake.inspector"
minimum_system_version = "13.0"

# Standalone because the embedded inspector is intentionally excluded from the root workspace.
[workspace]

[patch.crates-io]
gpui-base = { path = "../../vendor/gpui-base" }
gpui-pre-web = { path = "../../vendor/gpui-pre-web" }
