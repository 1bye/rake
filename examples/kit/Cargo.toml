[package]
name = "rake-kit-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
kit = ["rake/kit"]
devtools = ["rake/devtools"]

[dependencies]
rake.workspace = true

[[bin]]
name = "rake-kit-example"
path = "src/main.rs"
required-features = ["kit"]

[package.metadata.rake.bundle]
name = "Rake Kit"
identifier = "com.example.rake.kit"
