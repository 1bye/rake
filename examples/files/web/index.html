<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Toolkit</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>html,body,canvas{margin:0;width:100%;height:100%;display:block;background:#18232b}#error{color:white;font:16px system-ui;white-space:pre-wrap}</style></head>
<body><div id="error" role="alert" hidden></div>
<script type="module">
import init from './pkg/rake_files.js';
try { await init(); } catch (error) { const display=document.querySelector('#error');display.hidden=false;display.textContent=`Text Toolkit could not start: ${error}\nUse a WebGPU-capable browser on HTTPS or localhost.`; }
</script></body></html>
