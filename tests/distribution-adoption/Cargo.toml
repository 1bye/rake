[package]
name = "rake-distribution-adoption"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[features]
cargo-packager = ["dep:cargo-packager"]
tauri-bundler = ["dep:tauri-bundler"]

[dependencies]
cargo-packager = { version = "~0.11.8", default-features = false, features = ["rustls-tls"], optional = true }
tauri-bundler = { version = "~2.10.4", optional = true }
serde_json = "1"
