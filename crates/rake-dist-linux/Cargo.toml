[package]
name = "rake-dist-linux"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Linux packaging and integration for Rake applications"

[lints]
workspace = true

[features]
native-tests = []

[dependencies]
base64 = "0.23"
rake-dist-core = { version = "=0.1.0-alpha.2", path = "../rake-dist-core" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree = "0.20"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
rpm = { version = "0.30.2", default-features = false, features = ["gzip-compression", "payload"] }

[dev-dependencies]
tempfile = "3"
