[package]
name = "rake-updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
sparkle = ["native-lifecycle"]
native-tests = ["native-lifecycle"]
native-lifecycle = ["dep:cc", "dep:event-listener"]
appimage = ["dep:ureq", "dep:sha2", "dep:ed25519-dalek", "dep:hex", "dep:fs2", "dep:tempfile"]
velopack = ["dep:winreg", "dep:windows-sys", "dep:velopack", "dep:ureq", "dep:sha2", "dep:ed25519-dalek", "dep:hex", "dep:tempfile"]

[dependencies]
serde.workspace = true
rake-resources = { path = "../rake-resources" }
rake-dist-core = { path = "../rake-dist-core" }
thiserror.workspace = true
serde_json.workspace = true
event-listener = { version = "5.4", optional = true }
semver = "1"
url = "2.5"
sha2 = { version = "0.10", optional = true }
ed25519-dalek = { version = "2.2", optional = true }
hex = { version = "0.4", optional = true }
fs2 = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }

velopack = { version = "=1.2.161", optional = true, features = ["public-utils"] }

[dev-dependencies]
serde.workspace = true
futures.workspace = true

[build-dependencies]
cc = { version = "1", optional = true }

[[example]]
name = "native-quit"
required-features = ["native-tests"]

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", optional = true }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"], optional = true }
