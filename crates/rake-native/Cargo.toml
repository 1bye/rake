[package]
name = "rake-native"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Optional AppKit components hosted in Rake's GPUI layouts"

[lints]
workspace = true

[features]
# Opens a real AppKit/GPUI window; excluded from the default headless suite.
native-tests = []

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSArray", "NSEnumerator", "NSNotification"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "NSControl", "NSButton", "NSButtonCell", "NSCell", "NSImage", "NSSegmentedControl", "NSSegmentedCell", "NSGlassEffectView", "NSLayoutConstraint", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSAccessibility", "NSWindow", "objc2-quartz-core", "objc2-core-foundation"] }
thiserror.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
futures.workspace = true
gpui-base.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }

[[test]]
name = "appkit"
harness = false
required-features = ["native-tests"]
