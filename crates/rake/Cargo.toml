[package]
name = "rake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Portable application foundation for GPUI native and browser applications"

[lints]
workspace = true

[features]
default = ["gpui"]
native-lifecycle = ["dep:rake-updates", "rake-updates/native-lifecycle"]
updates = ["native-lifecycle"]
updates-sparkle = ["updates", "rake-updates/sparkle"]
updates-appimage = ["updates", "rake-updates/appimage"]
updates-velopack = ["updates", "rake-updates/velopack"]
devtools = ["rake-diagnostics/devtools", "rake-http/devtools", "objc2-app-kit?/objc2-quartz-core"]
devtools-memory = ["devtools", "dep:backtrace"]
experimental-view = ["gpui", "dep:rake-ui", "rake-macros/view"]
view-test-support = ["experimental-view", "gpui/test-support", "rake-ui/test-support"]
gpui = ["dep:gpui", "dep:gpui_platform", "dep:objc2-app-kit", "dep:raw-window-handle", "dep:windows-sys", "native-lifecycle"]

[dependencies]
rake-updates = { path = "../rake-updates", optional = true }
rake-resources = { path = "../rake-resources" }
rake-ui = { workspace = true, optional = true }
rake-http = { workspace = true, features = ["task-errors"] }
rake-protocol.workspace = true
rake-macros = { path = "../rake-macros" }
rake-diagnostics.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1.2.3"
tracing.workspace = true
futures.workspace = true
thiserror.workspace = true
url = "2.5"
uuid = { version = "1", features = ["v4", "serde", "js"] }
event-listener = "5.4"
web-time.workspace = true
gpui = { package = "gpui_ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "99109e3a77ddadbcb46cba8567e779a651600608", default-features = false, optional = true }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "99109e3a77ddadbcb46cba8567e779a651600608", features = ["font-kit", "wayland", "x11"], optional = true }

[target.'cfg(unix)'.dependencies]
rake-client.workspace = true
backtrace = { version = "0.3.76", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
anyhow = "1"
libc = "0.2"
async-io = "2.6"
blocking = "1.7"
tempfile = "3"
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Window", "History", "Location", "Event", "BeforeUnloadEvent", "EventTarget", "Document", "Element", "HtmlElement", "Node", "Storage", "ClipboardEvent", "DataTransfer"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSWindow", "NSResponder"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"], optional = true }

[dev-dependencies]
futures.workspace = true
tracing-subscriber.workspace = true
trybuild = "1"

[[test]]
name = "view_state"
required-features = ["view-test-support"]

[[bench]]
name = "control_queries"
harness = false

[[example]]
name = "startup-failure"
path = "examples/startup_failure.rs"
required-features = ["gpui"]

[[example]]
name = "storage"
required-features = ["devtools"]
