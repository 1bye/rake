[package]
name = "rake-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Portable application foundation for GPUI native and browser applications"
readme = "../../README.md"

[lib]
name = "rake"

[lints]
workspace = true

[features]
default = ["gpui"]
gpui = ["dep:rake-gpui", "dep:gpui_platform", "native-lifecycle"]
launch-at-login = ["rake-core/launch-at-login", "rake-gpui?/launch-at-login"]
tray = ["gpui", "rake-gpui/tray", "global-shortcuts"]
global-shortcuts = ["gpui", "rake-gpui/global-shortcuts"]
gpu-surface = ["gpui-fast", "rake-gpui/gpu-surface"]
gpui-fast = ["gpui", "dep:gpui_fast_platform", "rake-gpui/gpui-fast"]
live = ["gpui", "rake-gpui/live"]
native-components = ["gpui", "rake-gpui/native-components"]
native-lifecycle = ["rake-gpui?/native-lifecycle"]
updates = ["native-lifecycle", "rake-core/updates", "rake-gpui?/updates"]
updates-sparkle = ["updates", "rake-core/updates-sparkle", "rake-gpui?/updates-sparkle"]
updates-appimage = ["updates", "rake-core/updates-appimage", "rake-gpui?/updates-appimage"]
updates-velopack = ["updates", "rake-core/updates-velopack", "rake-gpui?/updates-velopack"]
devtools = ["rake-core/devtools", "rake-gpui?/devtools"]
devtools-memory = ["devtools", "rake-core/devtools-memory", "rake-gpui?/devtools-memory"]
kit = ["gpui", "rake-gpui/kit"]
# Deprecated compatibility alias; UI is provided by gpui (enabled by default).
experimental-view = []
experimental-reactive = ["gpui", "rake-gpui/experimental-reactive"]
locale = ["gpui", "rake-gpui/locale"]
locale-icu = ["locale", "rake-gpui/locale-icu"]
view-test-support = ["gpui", "rake-gpui/view-test-support", "dep:rake-ui"]

[dependencies]
# The secrets probe and component benchmark open a host directly.
gpui_platform = { workspace = true, optional = true }
gpui_fast_platform = { workspace = true, optional = true }
rake-core.workspace = true
rake-gpui = { workspace = true, optional = true }
rake-ui = { workspace = true, optional = true }
rake-macros = { version = "=0.1.0-alpha.7", path = "../rake-macros" }

[dev-dependencies]
rake-protocol.workspace = true
rake-diagnostics.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
tracing-subscriber.workspace = true
trybuild = "1"

rake-http = { workspace = true, features = ["task-errors"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
libc = "0.2"
async-io = "2.6"
tempfile = "3"

[target.'cfg(any(unix, windows))'.dev-dependencies]
rake-client.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = "0.2"

[[test]]
name = "view_state"
required-features = ["view-test-support"]

[[bench]]
name = "control_queries"
harness = false

[[example]]
name = "startup-failure"
path = "examples/startup_failure.rs"
required-features = ["gpui"]

[[example]]
name = "native"
required-features = ["native-components"]

[[example]]
name = "storage"
required-features = ["devtools"]

[[example]]
name = "web-crash"
path = "examples/web_crash.rs"
crate-type = ["cdylib"]
required-features = ["gpui"]

[[test]]
name = "function_components"
required-features = ["experimental-reactive", "view-test-support"]


[[bench]]
name = "function_components"
harness = false
required-features = ["experimental-reactive", "view-test-support"]


[[example]]
name = "components"
required-features = ["experimental-reactive"]


[[example]]
name = "secrets-probe"
path = "examples/secrets_probe.rs"
required-features = ["gpui"]
