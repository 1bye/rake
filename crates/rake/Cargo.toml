[package]
name = "rake-app"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Portable application foundation for GPUI native and browser applications"
readme = "../../README.md"

[lib]
name = "rake"

[lints]
workspace = true

[features]
default = ["gpui"]
launch-at-login = ["dep:rake-autostart"]
tray = ["gpui", "dep:rake-tray"]
gpu-surface = ["gpui-fast", "dep:metal", "dep:foreign-types", "dep:objc2", "dep:objc2-foundation", "dep:objc2-quartz-core", "objc2-app-kit?/objc2-quartz-core", "dep:windows"]
gpui-fast = ["gpui", "dep:gpui_fast", "dep:gpui_fast_platform", "rake-ui/gpui-fast", "rake-native?/gpui-fast"]
native-components = ["gpui", "dep:rake-native"]
native-lifecycle = ["dep:rake-updates", "rake-updates/native-lifecycle"]
updates = ["native-lifecycle"]
updates-sparkle = ["updates", "rake-updates/sparkle"]
updates-appimage = ["updates", "rake-updates/appimage"]
updates-velopack = ["updates", "rake-updates/velopack"]
devtools = ["gpui_pre?/profiler", "gpui_fast?/profiler", "rake-diagnostics/devtools", "rake-http/devtools", "objc2-app-kit?/objc2-quartz-core"]
devtools-memory = ["devtools", "dep:backtrace"]
kit = ["gpui", "rake-ui/kit"]
# Deprecated compatibility alias; UI is provided by gpui (enabled by default).
experimental-view = []
experimental-components = ["gpui-fast", "rake-macros/components", "dep:slotmap"]
view-test-support = ["gpui", "gpui_pre/test-support", "gpui_fast?/test-support", "rake-ui/test-support", "gpui_platform/runtime_shaders", "gpui_fast_platform?/runtime_shaders"]
gpui = ["dep:rake-ui", "rake-macros/view", "dep:gpui_pre", "dep:gpui_platform", "dep:objc2-app-kit", "dep:raw-window-handle", "dep:windows-sys", "native-lifecycle"]

[dependencies]
rake-autostart = { version = "=0.1.0-alpha.3", path = "../rake-autostart", optional = true }
rake-tray = { version = "=0.1.0-alpha.3", path = "../rake-tray", optional = true }
rake-updates = { version = "=0.1.0-alpha.2", path = "../rake-updates", optional = true }
rake-resources = { version = "=0.1.0-alpha.2", path = "../rake-resources" }
rake-ui = { workspace = true, optional = true }
rake-native = { workspace = true, optional = true }
rake-http = { workspace = true, features = ["task-errors"] }
rake-protocol.workspace = true
rake-macros = { version = "=0.1.0-alpha.3", path = "../rake-macros" }
rake-diagnostics.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1.2.3"
slotmap = { version = "1.1", optional = true }
tracing.workspace = true
futures.workspace = true
thiserror.workspace = true
url = "2.5"
uuid = { version = "1", features = ["v4", "serde", "js"] }
event-listener = "5.4"
web-time.workspace = true
gpui_pre = { package = "gpui-pre", version = "=0.3.11", default-features = false, optional = true }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"], optional = true }
gpui_fast = { workspace = true, optional = true }
gpui_fast_platform = { workspace = true, features = ["font-kit", "wayland", "x11"], optional = true }

[target.'cfg(unix)'.dependencies]
rake-client.workspace = true
backtrace = { version = "0.3.76", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
anyhow = "1"
libc = "0.2"
async-io = "2.6"
blocking = "1.7"
tempfile = "3"
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Window", "History", "Location", "Event", "BeforeUnloadEvent", "EventTarget", "Document", "Element", "HtmlElement", "Node", "Storage", "ClipboardEvent", "DataTransfer"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }
foreign-types = { version = "0.5", optional = true }
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"], optional = true }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSWindow", "NSResponder"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectComposition"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"], optional = true }

[dev-dependencies]
rake-tray = { version = "=0.1.0-alpha.3", path = "../rake-tray", features = ["test-support"] }
futures.workspace = true
tracing-subscriber.workspace = true
trybuild = "1"

[[test]]
name = "view_state"
required-features = ["view-test-support"]

[[bench]]
name = "control_queries"
harness = false

[[test]]
name = "function_components"
required-features = ["experimental-components", "view-test-support"]

[[bench]]
name = "function_components"
harness = false
required-features = ["experimental-components", "view-test-support"]

[[example]]
name = "startup-failure"
path = "examples/startup_failure.rs"
required-features = ["gpui"]

[[example]]
name = "components"
required-features = ["experimental-components"]

[[example]]
name = "native"
required-features = ["native-components"]

[[example]]
name = "storage"
required-features = ["devtools"]

[[example]]
name = "web-crash"
path = "examples/web_crash.rs"
crate-type = ["cdylib"]
required-features = ["gpui"]
