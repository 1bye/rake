[package]
name = "rake-macros"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Facade-aware application, data and instrumentation macros for Rake"

[lib]
proc-macro = true

[lints]
workspace = true

[features]
view = ["dep:rake-view-syntax"]

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro-crate = "3.5"
rake-view-syntax = { version = "=0.1.0-alpha.3", path = "../rake-view-syntax", optional = true }
