[package]
name = "rake-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal client for Rake development runtime control"

[lints]
workspace = true

[[bin]]
name = "rake"
path = "src/main.rs"
doc = false

[dependencies]
tempfile = "3"
rake-dist = { path = "../rake-dist" }
ctrlc = { version = "3.5", features = ["termination"] }
base64 = "0.22.1"
regex = "1"
rake-client.workspace = true
rake-protocol.workspace = true
rake-diagnostics = { workspace = true, features = ["devtools"] }
serde_json.workspace = true
serde.workspace = true
futures.workspace = true
url = "2.5"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
rake = { path = "../rake", default-features = false }
