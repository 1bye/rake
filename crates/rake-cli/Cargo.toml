[package]
name = "rake-app-cli"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Terminal client for Rake development runtime control"

[lints]
workspace = true

[[bin]]
name = "rake"
path = "src/main.rs"
doc = false

[dependencies]
rake-view-syntax = { version = "=0.1.0-alpha.3", path = "../rake-view-syntax", features = ["source-locations"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
toml = "0.9"
tempfile = "3"
rake-dist = { version = "=0.1.0-alpha.3", path = "../rake-dist" }
ctrlc = { version = "3.5", features = ["termination"] }
base64 = "0.22.1"
regex = "1"
rake-client.workspace = true
rake-protocol.workspace = true
rake-diagnostics = { workspace = true, features = ["devtools"] }
serde_json.workspace = true
serde.workspace = true
futures.workspace = true
libc = "0.2"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
rake = { package = "rake-app", version = "=0.1.0-alpha.3", path = "../rake", default-features = false }

[features]
# Explicit consumer builds: real compiler/SDK/wasm prerequisites, outside the fast suite.
scaffold-tests = []

[[test]]
name = "new_build"
required-features = ["scaffold-tests"]
