<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{name}}</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #18181b; }
  canvas { display: block; width: 100%; height: 100%; }
  #error { color: white; font: 16px system-ui; padding: 24px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="error" role="alert" hidden></div>
<script type="module">
  import init from './pkg/{{crate_name}}.js';
  try { await init(); }
  catch (error) {
    const display = document.querySelector('#error');
    display.hidden = false;
    display.textContent = `The app could not start: ${error}`;
    console.error(error);
  }
</script>
</body>
</html>
