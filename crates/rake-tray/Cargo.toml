[package]
name = "rake-tray"
description = "Native tray resources and portable tray contracts for Rake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
native-tests = ["dep:block2", "objc2-foundation/NSRunLoop", "objc2-foundation/NSDate", "objc2-foundation/block2"]

[dependencies]
thiserror.workspace = true
event-listener = "5.4"
futures.workspace = true
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSData", "NSGeometry", "NSArray", "NSThread", "NSKeyValueObserving"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSMenu", "NSMenuItem", "NSMenuItemBadge", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSAccessibility", "NSAccessibilityProtocols", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi"] }
uuid = { version = "1", features = ["v5"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }

[[example]]
name = "native-probe"
required-features = ["native-tests"]

