[package]
name = "rake-dist-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Windows packaging and executable manifests for Rake applications"

[lints]
workspace = true

[dependencies]
object = {version="0.37",default-features=false,features=["read","std"]}
sha2 = "0.10"
rake-dist-core = { version = "=0.1.0-alpha.2", path = "../rake-dist-core" }
thiserror.workspace = true
roxmltree = "0.20"
tempfile = "3"
dunce = "1"
url = "2.5"

[features]
native-tests = []
native-signing-tests = ["native-tests"]

[dev-dependencies]
rake-build = { version = "=0.1.0-alpha.2", path = "../rake-build" }
