[package]
name = "rake-dist"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Distribution planning and packaging for Rake applications"

[lints]
workspace = true

[dependencies]
ed25519-dalek = "2.2"
hex = "0.4"
base64 = "0.23"
semver = "1"
plist = "1"
rake-dist-core = { version = "=0.1.0-alpha.4", path = "../rake-dist-core", features = ["schema"] }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true

schemars = "1.2.3"

tauri-bundler = { version = "=2.10.4", default-features = false, features = ["rustls"] }
command-group = { version = "5.0.1", default-features = false }
tempfile = "3"
sha2 = "0.10"
fs2 = "0.4"
rake-build = { version = "=0.1.0-alpha.4", path = "../rake-build" }
rake-dist-windows = { version = "=0.1.0-alpha.4", path = "../rake-dist-windows" }
rake-dist-macos = { version = "=0.1.0-alpha.4", path = "../rake-dist-macos" }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
liblzma = "0.4"
object = { version = "0.37", default-features = false, features = ["read", "std"] }
dunce = "1"
rake-dist-linux = { version = "=0.1.0-alpha.4", path = "../rake-dist-linux" }
toml = "0.9"

# Private signing material is generated by the OS and cleared after use.
[dependencies.getrandom]
version = "0.3"
[dependencies.zeroize]
version = "1"
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
