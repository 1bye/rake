[package]
name = "rake-autostart"
description = "Portable per-user launch-at-login settings, independent of GPUI"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSProcessInfo", "NSString", "NSError"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Storage_Packaging_Appx"] }

[dev-dependencies]
futures.workspace = true
tempfile = "3"
