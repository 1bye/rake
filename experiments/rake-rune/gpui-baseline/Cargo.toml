[package]
name = "rake-gpui-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]
resolver = "3"

[features]
frame-profile = ["dep:gpui-profiler"]

[dependencies]
gpui-profiler = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["profiler"], optional = true }
rake = { package = "rake-app", git = "https://github.com/1bye/rake", rev = "0274048dc500a747ebf178700bf920beca865dc8", features = ["motion"] }

# Match the Rake workspace's dependency overrides.
[patch.crates-io]
gpui-base = { git = "https://github.com/1bye/rake", rev = "0274048dc500a747ebf178700bf920beca865dc8" }
gpui-pre = { git = "https://github.com/1bye/rake", rev = "0274048dc500a747ebf178700bf920beca865dc8" }
gpui-pre-web = { git = "https://github.com/1bye/rake", rev = "0274048dc500a747ebf178700bf920beca865dc8" }
