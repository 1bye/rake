[workspace]
members = ["crates/rake-dist-linux", "crates/rake-updates", "crates/rake-dist-macos", "crates/rake-build", "crates/rake-resources", "crates/rake-dist-windows", "crates/rake-dist-core", "crates/rake-dist", "crates/rake", "crates/rake-diagnostics", "crates/rake-http", "crates/rake-ui", "crates/rake-protocol", "crates/rake-client", "crates/rake-macros", "crates/rake-cli", "examples/desktop", "examples/distribution", "examples/foundation", "examples/routing", "examples/notes", "examples/view", "examples/inspector", "tests/renamed-facade", "tests/web-platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rake = { path = "crates/rake" }
rake-diagnostics = { path = "crates/rake-diagnostics" }
rake-http = { path = "crates/rake-http" }
rake-ui = { path = "crates/rake-ui" }
rake-protocol = { path = "crates/rake-protocol" }
rake-client = { path = "crates/rake-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
web-time = "1"
futures = "0.3"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/1bye/workflow", rev = "f62c7d7dcdf3ffd9b77de95a523544a0c688bb9b", pattern = "rust/spacing" }]
