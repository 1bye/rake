<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rake · Native preview</title><link rel="stylesheet" href="/__rake/preview.css"><script type="module" src="/__rake/preview.js"></script></head>
<body>
<header><strong>Rake <span>Native preview</span></strong><nav aria-label="Preview controls">
<button id="interact" aria-pressed="true">Interact</button><button id="select" aria-pressed="false">Select element</button>
<button id="copy" disabled>Copy selection</button><button id="reconnect">Reconnect capture</button></nav></header>
<p id="status" role="status">Connecting to the native application…</p>
<main><section class="canvas" aria-label="Live native window"><div id="stage">
<canvas id="screen" role="img" aria-label="Live native application preview" hidden></canvas><div id="outline" hidden></div>
</div></section><aside aria-label="Selected element"><h1>Selection</h1>
<p id="hint">Choose Select element, then click inside the preview. Selection does not activate the app control.</p>
<pre id="details"></pre></aside></main>
<footer>macOS native window · clicks and scrolling · Rake inspection boundaries</footer>
</body></html>
